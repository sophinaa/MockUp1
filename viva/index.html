function hl(code){
  const re = /(\/\/.*$)|("(?:[^"\\]|\\.)*"|`(?:[^`\\]|\\.)*`)|\b(import|from|export|async|function|const|let|return|await|if|for|try|catch|null|new)\b|\b(\d[\d_]*)\b|([A-Za-z_]\w*)(?=\s*[(<])/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) { out += esc(code.slice(last, m.index)); out += `<span class="hl-${m[1]?'c':m[2]?'s':m[3]?'k':m[4]?'n':'f'}">${esc(m[0])}</span>`; last = re.lastIndex; }
  return out + esc(code.slice(last));
}

  const V = S.review;
  if (V.grading) return '<div class="grading" role="status"><span class="orb"></span>Checking the demo answer…</div>';
  if (V.mode === 'voice') return `<div class="answer"><div class="listen"><div class="wave" id="wave" aria-hidden="true">${'<i></i>'.repeat(20)}</div><p class="said" id="said">${esc(V.said)||'Playing a sample transcript…'}</p><button class="btn primary" data-act="done-speaking">Use sample answer</button><button class="btn quiet" data-act="type">Type my answer instead</button></div><p class="note">Sample transcript only. Your microphone is off.</p></div>`;
  return `<div class="answer"><div class="typebox"><label class="sr" for="ans">Your explanation</label><textarea id="ans" placeholder="Here’s what I think happens…">${esc(V.draft)}</textarea><div class="answer-tools"><button data-act="speak">${ic('mic','sm')} Voice demo</button><button data-act="fill" data-v="strong">Try a sample</button></div><button class="btn primary" data-act="submit">Check my answer ${ic('chev','sm')}</button></div><p class="note">Practice mode · Simple answer guide, not AI grading.</p></div>`;
}


let waveRAF = null;
function wave(now){
  waveRAF = null; const w = document.getElementById('wave'); if (!w || !S.open) return;
  [...w.children].forEach((b, k) => { const v = RM.matches ? .5 : Math.abs(Math.sin(now/(130+k*4) + k*1.3) * Math.sin(now/420 + k*.5)); b.style.height = (6 + v*26).toFixed(1) + 'px'; });
  if (!RM.matches) waveRAF = requestAnimationFrame(wave);
}
function speak(){
  const V = S.review, Q = REVIEWS[V.key].questions[V.qi];
  clearTimers(); V.mode = 'voice'; V.said = ''; render();
  const words = (Q.strong).split(' '); let k = 0;
  const tick = () => { if (S.review !== V || V.mode !== 'voice') return; V.said += (k?' ':'') + words[k++]; const el = document.getElementById('said'); if (el) el.textContent = V.said; if (k < words.length) later(tick, 110 + Math.random()*80); };
  later(tick, 500);
}
function submit(text){
  const V = S.review; if (!V || V.grading) return;
  if (!text.trim()) { toast('Write an answer or play the sample first.', 'info'); return; }
  clearTimers(); V.grading = true; V.mode = null; render();
  later(() => grade(text.trim()), 1200);
}
// Deliberately limited prototype rubric. No claim of semantic or AI grading.
function matchesDemoRubric(key, qi, text){
  const t = text.toLowerCase().replace(/[’‘]/g,"'");
  if (t.trim().split(/\s+/).length < 6) return false;
  const rules = {
    payments:[[/twice|double|two charges|charges? (?:the card )?again|second charge/, /after|before|first|late|order/]],
    paymentsFix:[[/atomic|only one|first one|reserve|lock/, /key|claim|duplicate/], [/same key|same idempotency|idempotency key/, /processor|original|returns?|new charge/]],
    webhooks:[[/replay|resend|send it again|reuse/, /15|fifteen/, /idempotency|duplicate/]],
    notify:[[/payment.*(?:through|succeed|works)|pay.*(?:succeed|works)/, /receipt|email/, /queue|later|late|delay|wait/], [/retry|retried/, /minute|batch|25|drain/]],
    config:[[/restart|reboot|redeploy|next start/, /cache|first|keeps/]],
  };
  if (key === 'payments' && /(?:not|never|won't|doesn't|cannot|can't) (?:be )?(?:double[- ]?charged|charged twice|charge (?:the card )?(?:twice|again))/.test(t)) return false;
  return (rules[key]?.[qi] || []).every(rule => rule.test(t));
}
function grade(text){
  const V = S.review, R = REVIEWS[V.key], Q = R.questions[V.qi], I = isl(R.island);
  V.grading = false;
  if (Q.bugKw) {
    if (matchesDemoRubric(V.key,V.qi,text)) { S.pay = 'bug'; S.history.unshift({kind:'bug', island:I.id, when:'Just now', text:'Spotted a double-charge risk: the duplicate check ran after the charge.', quote:text}); return discover({kind:'bug', key:V.key, quote:text}); }
    return discover({kind:'weak', key:V.key, hint:Q.hint});
  }
  if (matchesDemoRubric(V.key,V.qi,text)) {
    if (V.qi < R.questions.length - 1) { V.qi++; V.draft = ''; V.said = ''; V.mode = 'type'; V.nice = true; V.closer = false; render(); $('#qh')?.focus(); later(() => { if (S.review === V) { V.nice = false; render(); } }, 2200); return; }
    const before = explored(), previousRank = rank();
    I.status = 'understood';
    if (V.key === 'paymentsFix') S.pay = 'done';
    S.history.unshift({kind:'explored', island:I.id, when:'Just now', text:R.learned.replace(/^You /,'You ').replace(/\.$/,'') + '.', quote:text});
    const ms = [];
    if (explored() >= 5 && before < 5) ms.push('More than half your world is clear');
    if (explored() === 8) ms.push('Every island explored');
    if (V.key === 'paymentsFix') ms.push('Bug caught and fixed before it shipped');
    return discover({kind:'understood', key:V.key, milestone:ms[0], quote:text,newArea:explored()>before,levelUp:rank().level>previousRank.level});
  }
  discover({kind:'weak', key:V.key, hint:Q.hint});
}
function discover(d){ d.newBadges=syncBadges(); S.disc = d; clearTimers(); go('discovery'); }

/* ================= discovery ================= */
function discoveryView(){
  const D = S.disc, R = REVIEWS[D.key], I = isl(R.island);
  if (D.kind === 'understood') return `<section class="disc" aria-labelledby="dh">${rewardScene()}<span class="kicker">${D.levelUp?'Level up · '+rank().name:'Quest complete'}</span><h1 id="dh">${I.name}, uncovered.</h1><p class="lead">${esc(R.learned)}</p><span class="milestone">${ic('bulb','sm')} ${D.newArea?'+1 lantern lit':'Lantern still glowing'} · ${explored()} of 8</span>${badgeUnlock(D.newBadges)}${R.push?'<p class="note">Demo push allowed. No real code was pushed.</p>':''}<div class="actions"><button class="btn primary" data-act="finish">Back to work</button><button class="btn quiet" data-act="back-map">Next quest</button></div></section>`;
  if (D.kind === 'weak') return `<section class="disc" aria-labelledby="dh">${explorer()}<h1 id="dh">A little fog remains.</h1><p class="lead">Free retry. Your explorer found a clue.</p><div class="hintcard">${esc(D.hint)}</div><div class="actions"><button class="btn primary" data-act="retry">Try again</button><button class="btn quiet" data-act="skip">Skip for now · fog stays</button></div></section>`;
  const A = D.agent;
  return `<section class="disc" aria-labelledby="dh">${A?explorer():rewardScene('bug')}<span class="kicker">Hidden bug discovered</span><h1 id="dh">You spotted a double charge.</h1>${badgeUnlock(A?[]:D.newBadges)}<p class="lead">The retry charges the card before checking for a duplicate. You caught it before it shipped.</p><div class="pushbar">Demo push paused. Let’s fix it before clearing the fog.</div>
  ${A?'<div class="agentlog" role="status">'+A.lines.map(l=>'<div class="'+(l.ok?'ok':'')+'">'+(l.ok?'✓ ':'› ')+esc(l.t)+'</div>').join('')+'</div>':''}
  <div class="actions">${!A?'<button class="btn primary" data-act="send-agent">Fix with demo agent</button>':A.done?'<button class="btn primary" data-act="review-fix">Review the fix</button>':'<button class="btn primary" disabled>Demo agent is fixing it…</button>'}<button class="btn quiet" data-act="skip">Skip & allow demo push</button></div><p class="note">Agent and Git actions are simulated.</p></section>`;
}


function sendAgent(){
  const D = S.disc; if (D.agent) return; D.agent = {lines:[], done:false}; render();
  const steps = ['Reading your finding','Claiming the key before the card is charged','Also passing the key to the card processor','Adding a test: charge succeeds, times out, retry charges once',{t:'Fix ready in b7e21f0. Tests pass.', ok:true}];
  steps.forEach((s, k) => later(() => { D.agent.lines.push(typeof s === 'string' ? {t:s} : s); if (k === steps.length-1) { D.agent.done = true; S.pay = 'fixed'; saveProgress(); } if (S.screen === 'discovery') render(); }, 700 + k*800));
}

/* ================= past discoveries ================= */
function pastView(){
  return `<section class="past"><div class="rv-top"><button class="icon-btn" data-act="to-world" aria-label="Back to Viva">${ic('back','sm')}</button><span>Your little wins</span></div><h1 tabindex="-1">Your collection</h1>${badgeShelf()}<p class="collection-note">Scout → Pathfinder at 6 lanterns → Lightkeeper at 8.</p><div>${S.history.map(h=>'<article class="entry">'+ic(h.kind==='bug'?'bug':h.kind==='skipped'?'cloud':'sun','sm')+'<div><p>'+esc(h.text)+'</p><div class="meta">'+isl(h.island).name+' · '+esc(h.when||'Previous visit')+'</div>'+(h.quote?'<details><summary>Your explanation</summary><q>'+esc(h.quote)+'</q></details>':'')+'</div></article>').join('')}</div><button class="btn quiet" data-act="reset">Reset demo progress</button></section>`;
}


/* ================= routing ================= */
function go(screen){ if (location.hash !== '#'+screen) location.hash = screen; else { S.screen = screen; render(); } }
function render(){
  syncBadges();
  saveProgress();
  renderTop();
  const m = $('#main');
  if (S.screen === 'review' && !S.review) S.screen = 'world';
  if (S.screen === 'discovery' && !S.disc) S.screen = 'world';
  m.innerHTML = S.screen === 'review' ? reviewView() : S.screen === 'discovery' ? discoveryView() : S.screen === 'past' ? pastView() : worldView();
  if (S.open && document.getElementById('wave') && !waveRAF) waveRAF = requestAnimationFrame(wave);
  const ta = document.getElementById('ans'); if (S.open && ta && S.review?.mode === 'type' && document.activeElement !== ta) ta.focus();
}
addEventListener('hashchange', () => {
  const h = location.hash.slice(1);
  S.screen = ['world','review','discovery','past'].includes(h) ? h : 'world';
  clearTimers();
  if (S.disc?.agent && !S.disc.agent.done && S.screen !== 'discovery') S.disc.agent = null;
  if (S.review) S.review.grading = false;
  render(); scrollTo(0,0);
  const f = $('#main h1'); if (S.open && f) { f.setAttribute('tabindex','-1'); f.focus({preventScroll:true}); }
});
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, V = S.review;
  switch (a) {
    case 'explore': { const n = nextIsland(); if (n) beginIsland(n.id); break; }
    case 'start': beginIsland(t.dataset.id); break;
    case 'to-world': go('world'); break;
    case 'minimise': setOpen(false); break;
    case 'toggle-widget': setOpen(!S.open); break;
    case 'past': go('past'); break;
    case 'finish': S.disc = null; S.review = null; go('world'); setOpen(false); break;
    case 'reset': $('#reset-dialog').showModal(); break;
    case 'cancel-reset': $('#reset-dialog').close(); break;
    case 'confirm-reset': {
      clearTimers(); restoreProgress(JSON.parse(INITIAL));
      S.review = null; S.disc = null; S.sel = null; S.cleared = null;
      ISLANDS.forEach(i => S.fog[i.id] = fogTarget(i));
      $('#reset-dialog').close(); go('world'); break;
    }
    case 'closer': V.closer = !V.closer; render(); break;
    case 'speak': speak(); break;
    case 'type': clearTimers(); V.mode = 'type'; render(); break;
    case 'done-speaking': submit(V.said); break;
    case 'fill': V.draft = REVIEWS[V.key].questions[V.qi][t.dataset.v]; render(); break;
    case 'submit': submit(document.getElementById('ans').value); break;
    case 'skip': skip(); break;
    case 'retry': S.review.draft = ''; S.review.said = ''; S.review.mode = 'type'; go('review'); break;
    case 'send-agent': sendAgent(); break;
    case 'review-fix': startReview('paymentsFix'); break;
    case 'back-map': { const id = REVIEWS[S.disc.key].island; S.cleared = id; S.disc = null; S.review = null; go('world'); toast(`${isl(id).name} explored · ${explored()} of 8 areas clear`); setTimeout(() => { S.cleared = null; }, 2600); break; }
  }
});
document.addEventListener('input', e => { if (e.target.id === 'ans') S.review.draft = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#reset-dialog').open) setOpen(false);
  if (e.target.id === 'ans' && e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(e.target.value); }
});
function beginIsland(id){
  if (id === 'payments') {
    if (S.pay === 'bug') { if (!S.disc || S.disc.kind !== 'bug') S.disc = {kind:'bug', key:'payments'}; S.review = null; S.sel = null; return go('discovery'); }
    return startReview(S.pay === 'fixed' ? 'paymentsFix' : 'payments');
  }
  startReview(isl(id).review);
}
function skip(){
  const key = S.review?.key || S.disc?.key; const R = REVIEWS[key], I = isl(R.island);
  clearTimers();
  if (R.push && S.pay !== 'done') S.pay = 'skipped';
  S.history.unshift({kind:'skipped', island:I.id, when:'Just now', text: R.push ? 'Skipped the review. The push went ahead and the fog stayed.' : 'Skipped for now. The fog stayed.'});
  S.review = null; S.disc = null; go('world');
  toast(R.push ? `Skipped. The fog stays on ${I.name}, and your push went ahead.` : `Skipped for now. The fog stays on ${I.name}.`, 'cloud');
}

const h = location.hash.slice(1);
S.screen = ['world','past'].includes(h) ? h : 'world';
render();
})();
</script>
